name: Chain Audited API
run-name: Chain Audited API / ${{ github.ref_name }}

on:
  push:
    tags:
      - "ci/chain-audited-api/**"
  workflow_dispatch:
    inputs:
      run_10m:
        description: Run the ten-million-key authenticated DB baseline
        required: true
        default: true
        type: boolean
      spine_commit:
        description: Full committed vbytemaster/spine SHA containing the Spine acceptance corpus
        required: true
        type: string

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  gate:
    name: Validate reviewed Forge and Spine revisions
    runs-on: ubuntu-26.04
    outputs:
      forge_commit: ${{ steps.revisions.outputs.forge_commit }}
      spine_commit: ${{ steps.revisions.outputs.spine_commit }}
      run_10m: ${{ steps.revisions.outputs.run_10m }}
    steps:
      - id: revisions
        name: Resolve immutable acceptance revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          INPUT_RUN_10M: ${{ inputs.run_10m }}
          INPUT_SPINE_COMMIT: ${{ inputs.spine_commit }}
        run: |
          set -euo pipefail

          forge_commit="$EVENT_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then
            pattern='^refs/tags/ci/chain-audited-api/([0-9a-f]{40})/spine-([0-9a-f]{40})/(1m|10m)$'
            if [[ ! "$EVENT_REF" =~ $pattern ]]; then
              echo "invalid Chain Audited API acceptance tag: $EVENT_REF" >&2
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" != "$forge_commit" ]]; then
              echo "acceptance tag does not point to its declared Forge revision" >&2
              exit 1
            fi
            spine_commit="${BASH_REMATCH[2]}"
            [[ "${BASH_REMATCH[3]}" == "10m" ]] && run_10m=true || run_10m=false
          else
            spine_commit="$INPUT_SPINE_COMMIT"
            run_10m="$INPUT_RUN_10M"
          fi

          if [[ ! "$forge_commit" =~ ^[0-9a-f]{40}$ || ! "$spine_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Forge and Spine revisions must be full lowercase 40-character Git SHAs" >&2
            exit 1
          fi
          if [[ "$run_10m" != "true" && "$run_10m" != "false" ]]; then
            echo "run_10m must resolve to true or false" >&2
            exit 1
          fi

          echo "forge_commit=$forge_commit" >> "$GITHUB_OUTPUT"
          echo "spine_commit=$spine_commit" >> "$GITHUB_OUTPUT"
          echo "run_10m=$run_10m" >> "$GITHUB_OUTPUT"

  style:
    name: ubuntu-26.04 / structure, format, and pinned Spine evidence
    needs: gate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.forge_commit }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install clang-format 22
        run: sudo apt-get update && sudo apt-get install -y clang-format-22

      - name: Check Forge-owned sources
        shell: bash
        run: |
          base_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          clang_format="$(command -v clang-format-22 || command -v clang-format)"
          git_clang_format="$(command -v git-clang-format-22 || command -v git-clang-format)"

          sources=()
          while IFS= read -r -d '' source; do
            case "$source" in
              *.cppm|*.cpp|*.hpp|*.hxx) sources+=("$source") ;;
            esac
          done < <(
            git diff --name-only --diff-filter=ACMR -z "$base_tag"...HEAD -- \
              libraries/api libraries/chain/api libraries/chain/protocol libraries/db/authenticated \
              libraries/net/http tests/chain_api tests/db_authenticated tests/http_websocket \
              tests/package_chain_api_component
          )

          if (( ${#sources[@]} != 0 )); then
            format_diff="$(
              "$git_clang_format" --diff --quiet --binary "$clang_format" \
                "$base_tag" -- "${sources[@]}"
            )"
            if [[ -n "$format_diff" ]]; then
              printf '%s\n' "$format_diff"
              exit 1
            fi
          fi

          git diff --check "$base_tag"...HEAD

      - name: Validate pinned Spine revision
        shell: bash
        env:
          SPINE_COMMIT: ${{ needs.gate.outputs.spine_commit }}
        run: |
          if [[ ! "$SPINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "spine_commit must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi

      - name: Checkout pinned Spine acceptance corpus
        uses: actions/checkout@v4
        with:
          repository: vbytemaster/spine
          ref: ${{ needs.gate.outputs.spine_commit }}
          path: spine-acceptance
          persist-credentials: false
          submodules: false

      - name: Check Spring manifest against pinned Spine corpus
        shell: bash
        env:
          SPINE_COMMIT: ${{ needs.gate.outputs.spine_commit }}
        run: |
          actual_spine_commit="$(git -C "$GITHUB_WORKSPACE/spine-acceptance" rev-parse HEAD)"
          if [[ "$actual_spine_commit" != "$SPINE_COMMIT" ]]; then
            echo "checked out Spine commit $actual_spine_commit, expected $SPINE_COMMIT" >&2
            exit 1
          fi
          python3 tests/chain_api/check_spring_api_manifest.py \
            . "$GITHUB_WORKSPACE/spine-acceptance"

  native:
    name: ${{ matrix.os }} / Release
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.forge_commit }}
          persist-credentials: false
          submodules: recursive

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake glaze gmp libngtcp2 ninja openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix boost);$(brew --prefix glaze);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y clang-22 clang-tools-22 libc++-22-dev libc++abi-22-dev
            echo "CC=/usr/bin/clang-22" >> "$GITHUB_ENV"
            echo "CXX=/usr/bin/clang++-22" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
            echo "LDFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          else
            brew install llvm
            llvm_prefix="$(brew --prefix llvm)"
            echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
            echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/chain-audited-api -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DBUILD_TESTING=ON

      - name: Build acceptance targets
        run: >-
          cmake --build build/chain-audited-api --target
          test_forge_chain_protocol_query
          test_forge_chain_api
          test_forge_db_authenticated
          test_forge_http_websocket
          test_forge_package_chain_api_component
          -j 4

      - name: Run acceptance
        run: >-
          ctest --test-dir build/chain-audited-api
          -R '^(test_forge_chain_protocol_query|test_forge_chain_api|test_forge_db_authenticated|test_forge_http_websocket|test_forge_package_chain_api_component)$'
          --output-on-failure -j 1

  sanitizer:
    name: ubuntu-26.04 / ASan+UBSan+fuzz
    needs: gate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.forge_commit }}
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake glaze gmp libngtcp2 ninja openssl@3
          sudo apt-get update
          sudo apt-get install -y clang-22 clang-tools-22 libc++-22-dev libc++abi-22-dev
          echo "CC=/usr/bin/clang-22" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-22" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix boost);$(brew --prefix glaze);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          sanitizer_flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build/chain-audited-api-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_C_FLAGS="$sanitizer_flags" \
            -DCMAKE_CXX_FLAGS="$sanitizer_flags -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="$sanitizer_flags -stdlib=libc++" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DFORGE_DB_AUTHENTICATED_ENABLE_FUZZ_TESTS=ON \
            -DBUILD_TESTING=ON

      - name: Build sanitizer and fuzz targets
        run: >-
          cmake --build build/chain-audited-api-sanitizer --target
          test_forge_chain_api
          test_forge_db_authenticated
          forge_db_authenticated_fuzz
          -j 4

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build/chain-audited-api-sanitizer
          -R '^(test_forge_chain_api|test_forge_db_authenticated)$'
          --output-on-failure -j 1

      - name: Run hostile-input fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: build/chain-audited-api-sanitizer/tests/forge_db_authenticated_fuzz -max_total_time=60

  performance:
    name: ${{ matrix.os }} / authenticated DB baselines
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.forge_commit }}
          persist-credentials: false
          submodules: recursive

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake glaze gmp libngtcp2 ninja openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix boost);$(brew --prefix glaze);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y clang-22 libc++-22-dev libc++abi-22-dev
            echo "CC=/usr/bin/clang-22" >> "$GITHUB_ENV"
            echo "CXX=/usr/bin/clang++-22" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
            echo "LDFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
          else
            brew install llvm
            llvm_prefix="$(brew --prefix llvm)"
            echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
            echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
            echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure benchmark
        shell: bash
        run: |
          cmake -S . -B build/chain-audited-api-performance -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DBUILD_TESTING=ON
          cmake --build build/chain-audited-api-performance --target benchmark_forge_db_authenticated -j 4

      - name: Run one-million-key baseline
        shell: bash
        run: |
          mkdir -p build/chain-audited-api-performance/results
          build/chain-audited-api-performance/tests/benchmark_forge_db_authenticated \
            --baseline 1m --machine-label "${{ matrix.os }}-Release" \
            | tee build/chain-audited-api-performance/results/authenticated-1m.json

      - name: Run ten-million-key baseline
        if: needs.gate.outputs.run_10m == 'true'
        shell: bash
        run: |
          build/chain-audited-api-performance/tests/benchmark_forge_db_authenticated \
            --baseline 10m --machine-label "${{ matrix.os }}-Release" \
            | tee build/chain-audited-api-performance/results/authenticated-10m.json

      - uses: actions/upload-artifact@v4
        with:
          name: authenticated-db-${{ matrix.os }}
          path: build/chain-audited-api-performance/results/*.json
